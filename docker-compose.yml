#version: "3.8"

services:
  fuseki:
    image: stain/jena-fuseki
    container_name: fuseki
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki
    environment:
      - ADMIN_PASSWORD=admin
    command: >
      sh -c "mkdir -p /fuseki/databases &&
            /jena-fuseki/fuseki-server --tdb2 --loc=/fuseki/databases --update /dataset"

  input-api:
    build: ./input-api
    ports:
      - "8000:8000"
    depends_on:
      - fuseki

  compliance-api:
    build: ./compliance-api
    ports:
      - "8001:8000"
    depends_on:
      - fuseki

  status-api:
    build: ./status-api
    ports:
      - "8002:8000"
    depends_on:
      - fuseki

volumes:
  fuseki-data:


