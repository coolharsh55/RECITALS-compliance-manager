# Fuseki access control, filled in from FUSEKI_USER and FUSEKI_PASSWORD
# (see .env) every time the fuseki container starts.
#
# Queries are open; updates, uploads and the admin pages need the user.
# Fuseki is published on 127.0.0.1 only, so queries are open only to
# this machine and the other containers.

[main]
ssl.enabled = false

plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
${FUSEKI_USER}=${FUSEKI_PASSWORD}

[roles]

[urls]
## Control functions open to anyone
/$/status = anon
/$/ping   = anon

## Admin pages and dataset management
/$/** = authcBasic,user[${FUSEKI_USER}]

## SPARQL update
/*/update/** = authcBasic,user[${FUSEKI_USER}]

## Graph store protocol (uploads)
/*/data/** = authcBasic,user[${FUSEKI_USER}]

## Everything else (SPARQL query)
/**=anon
